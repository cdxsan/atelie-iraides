<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Novo Pedido — Ateliê Iraides</title>
  <link rel="stylesheet" href="css/estilo.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="index.html" class="top-bar-logo">
        <svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 4C10 4 8 7 8 9l-3 6 2 2 4-2-1 9h8l-1-9 4 2 2-2-3-6c0-2-2-5-6-5z" stroke="#ff6b6b" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        </svg>
        Ateliê <span>Iraides</span>
      </a>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="catalogo.html">Catálogo</a>
        <span class="nav-divider"></span>
        <span class="nav-label">Protegido</span>
        <a href="dashboard.html" class="nav-painel">Painel</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="carrinho.html" class="nav-carrinho">Carrinho</a>
        <span class="nav-divider"></span>
        <a href="#" class="entrar" id="nav-entrar">Sair</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div id="conteudo-protegido" style="display:none;">
    <h2>Novo Pedido</h2>

    <!-- ── COLAR TEXTO DO WHATSAPP + IA ── -->
    <div class="card" style="border-color:rgba(255,107,107,0.3);">
      <label class="form-label" style="font-size:14px;">
        Colar texto do WhatsApp
        <span style="color:var(--text3);font-weight:400;"> (IA extrai automaticamente)</span>
      </label>
      <textarea class="form-input" id="texto-bruto" placeholder="Cole aqui o texto da conversa do WhatsApp com a cliente..." oninput="atualizarContador()"></textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <span id="contador-texto" style="font-size:12px;color:var(--text3);">0 / 1500</span>
        <span id="indicador-confianca" style="display:none;font-size:13px;font-weight:600;"></span>
      </div>
      <button class="btn btn-primary" id="btn-extrair" onclick="extrairPedido()" style="width:100%;margin-top:8px;">
        🤖 Extrair Pedido
      </button>
      <div id="status-extracao" style="display:none;margin-top:8px;font-size:14px;"></div>
      <div id="erro-extracao" style="display:none;margin-top:8px;font-size:14px;color:var(--accent);"></div>
    </div>

    <!-- ── CAMPO OCULTO PRA CONFIANCE ── -->
    <input type="hidden" id="confianca-valor" value="">

    <!-- ── DADOS DO CLIENTE ── -->
    <div class="card">
      <div class="form-group">
        <label class="form-label">Nome do cliente</label>
        <input class="form-input" id="cliente-nome" placeholder="Nome da cliente">
      </div>

      <div class="form-group">
        <label class="form-label">WhatsApp</label>
        <input class="form-input" id="cliente-whatsapp" placeholder="(xx) xxxxx-xxxx">
      </div>

      <div class="form-group">
        <label class="form-label">Endereço de entrega</label>
        <textarea class="form-input" id="cliente-endereco" style="min-height:60px;" placeholder="Rua, número, bairro, cidade"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Frete (em centavos — ex: 1200 = R$ 12,00)</label>
        <input class="form-input" id="frete-valor" type="number" placeholder="1200" oninput="recalcularPrevia()">
      </div>
    </div>

    <!-- ── ITENS DO PEDIDO ── -->
    <div class="card">
      <label class="form-label">Itens do pedido</label>
      <p style="font-size:12px;color:var(--text3);margin-bottom:8px;">Preço em centavos (ex: 8900 = R$ 89,00)</p>
      <div id="itens-lista"></div>
      <button class="btn btn-small btn-outline" onclick="adicionarItem()" style="margin-top:8px;">+ Adicionar item</button>

      <div id="previa-total" style="text-align:right;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:20px;font-weight:700;color:var(--accent);">
        Total: R$ 0,00
      </div>
    </div>

    <!-- ── ERRO ── -->
    <div id="erro-pedido" class="login-erro"></div>

    <!-- ── SALVAR ── -->
    <button class="btn btn-primary" id="btn-salvar-pedido" onclick="salvarPedido()">Salvar Pedido</button>
    <a href="pedidos.html" class="btn btn-outline" style="margin-top:8px;">Cancelar</a>
    </div><!-- /conteudo-protegido -->
  </main>

  <div id="aviso-futuro" class="aviso-futuro"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async function() {
      await protegerPagina();
      await ajustarNav();

      var admin = await isAdmin();
      if (!admin) {
        window.location.href = 'carrinho.html';
        return;
      }

      var entrar = document.getElementById('nav-entrar');
      if (entrar) entrar.onclick = function(e) { e.preventDefault(); fazerLogout(); };

      adicionarItem();
    })();

    function escaparAtributo(valor) {
      return String(valor).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
    }

    function adicionarItem(nome, qtd, preco) {
      var lista = document.getElementById('itens-lista');
      var div = document.createElement('div');
      div.className = 'pedido-item';
      div.innerHTML =
        '<input class="form-input item-nome" placeholder="Nome do produto" style="flex:2;margin-right:6px;min-height:40px;padding:8px;" value="' + escaparAtributo(nome || '') + '">' +
        '<input class="form-input item-qtd" type="number" placeholder="Qtd" style="width:56px;margin-right:6px;min-height:40px;padding:8px;" value="' + escaparAtributo(qtd || 1) + '">' +
        '<input class="form-input item-preco" type="number" placeholder="Centavos" style="flex:1;margin-right:6px;min-height:40px;padding:8px;" value="' + escaparAtributo(preco || '') + '">' +
        '<button class="btn btn-small" onclick="removerItem(this)" style="width:36px;padding:0;min-height:36px;background:transparent;color:var(--accent);font-size:18px;border:none;cursor:pointer;">✕</button>';
      lista.appendChild(div);

      var inputs = div.querySelectorAll('input');
      inputs.forEach(function(inp) {
        inp.addEventListener('input', recalcularPrevia);
      });
      recalcularPrevia();
    }

    function removerItem(btn) {
      var lista = document.getElementById('itens-lista');
      if (lista.children.length <= 1) return;
      btn.closest('.pedido-item').remove();
      recalcularPrevia();
    }

    function recalcularPrevia() {
      var frete = parseInt(document.getElementById('frete-valor').value) || 0;
      var soma = 0;
      document.querySelectorAll('#itens-lista .pedido-item').forEach(function(row) {
        var qtd = parseInt(row.querySelector('.item-qtd').value) || 0;
        var preco = parseInt(row.querySelector('.item-preco').value) || 0;
        soma += qtd * preco;
      });
      var total = frete + soma;
      document.getElementById('previa-total').textContent = 'Total: R$ ' + (total / 100).toFixed(2).replace('.', ',');
    }

    async function salvarPedido() {
      var nome = document.getElementById('cliente-nome').value.trim();
      var whatsapp = document.getElementById('cliente-whatsapp').value.trim();
      var endereco = document.getElementById('cliente-endereco').value.trim();
      var frete = parseInt(document.getElementById('frete-valor').value) || 0;

      if (!nome || !whatsapp || !endereco) {
        mostrarErro('Preencha nome, WhatsApp e endereço do cliente.');
        return;
      }

      var itens = [];
      document.querySelectorAll('#itens-lista .pedido-item').forEach(function(row) {
        var itemNome = row.querySelector('.item-nome').value.trim();
        var qtd = parseInt(row.querySelector('.item-qtd').value) || 0;
        var preco = parseInt(row.querySelector('.item-preco').value) || 0;
        if (itemNome && qtd > 0 && preco > 0) {
          itens.push({ nome: itemNome, quantidade: qtd, preco_unitario: preco });
        }
      });

      if (itens.length === 0) {
        mostrarErro('Adicione pelo menos um item ao pedido.');
        return;
      }

      var soma = itens.reduce(function(s, i) { return s + i.quantidade * i.preco_unitario; }, 0);
      var total = frete + soma;

      var btn = document.getElementById('btn-salvar-pedido');
      btn.disabled = true;
      btn.textContent = 'Salvando…';

      var textoBruto = document.getElementById('texto-bruto').value.trim() || null;
      var confiancaRaw = document.getElementById('confianca-valor').value;
      var confianca = confiancaRaw ? parseInt(confiancaRaw) : null;

      var { data: pedido, error: erroPedido } = await supabase
        .from('pedido')
        .insert({
          cliente_nome: nome,
          cliente_whatsapp: whatsapp,
          cliente_endereco: endereco,
          frete_valor: frete,
          total: total,
          texto_bruto: textoBruto,
          confianca: confianca
        })
        .select()
        .single();

      if (erroPedido) {
        btn.disabled = false;
        btn.textContent = 'Salvar Pedido';
        mostrarErro('Erro ao salvar pedido: ' + erroPedido.message);
        return;
      }

      var itensParaInserir = itens.map(function(i) {
        return {
          pedido_id: pedido.id,
          nome: i.nome,
          quantidade: i.quantidade,
          preco_unitario: i.preco_unitario
        };
      });

      var { error: erroItens } = await supabase.from('pedido_item').insert(itensParaInserir);

      if (erroItens) {
        btn.disabled = false;
        btn.textContent = 'Salvar Pedido';
        mostrarErro('Erro ao salvar itens: ' + erroItens.message);
        return;
      }

      window.location.href = 'pedidos.html';
    }

    function mostrarErro(msg) {
      var el = document.getElementById('erro-pedido');
      el.textContent = msg;
      el.style.display = 'block';
    }

    // ── EXTRATOR COM IA ──

    function atualizarContador() {
      var el = document.getElementById('texto-bruto');
      var cont = document.getElementById('contador-texto');
      var len = el.value.length;
      cont.textContent = len + ' / 1500';
      cont.style.color = len > 1500 ? 'var(--accent)' : 'var(--text3)';
    }

    function mostrarErroExtracao(msg) {
      var el = document.getElementById('erro-extracao');
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function extrairPedido() {
      var textoEl = document.getElementById('texto-bruto');
      var texto = textoEl.value.trim();

      if (!texto) {
        mostrarErroExtracao('Cole o texto da conversa do WhatsApp primeiro.');
        return;
      }

      if (texto.length > 1500) {
        mostrarErroExtracao('Texto muito longo. Limite de 1500 caracteres.');
        return;
      }

      var btn = document.getElementById('btn-extrair');
      var statusEl = document.getElementById('status-extracao');
      var erroEl = document.getElementById('erro-extracao');

      erroEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '🤖 Extraindo…';
      statusEl.style.display = 'block';
      statusEl.textContent = '⏳ IA est\u00E1 lendo o texto…';

      try {
        var sessao = await supabase.auth.getSession();
        var token = sessao.data.session?.access_token;
        if (!token) throw new Error('Fa\u00E7a login novamente.');

        var resposta = await fetch(
          'https://jfyeowqksutlyljsowuw.supabase.co/functions/v1/resumo-do-dia',
          {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ texto: texto })
          }
        );

        var dados = await resposta.json();

        if (!resposta.ok) {
          throw new Error(dados.erro || 'Erro ao extrair pedido.');
        }

        var sugestao = dados.sugestao;

        // Preencher dados do cliente
        document.getElementById('cliente-nome').value = sugestao.cliente_nome || '';
        document.getElementById('cliente-whatsapp').value = sugestao.cliente_whatsapp || '';
        document.getElementById('cliente-endereco').value = sugestao.cliente_endereco || '';
        document.getElementById('frete-valor').value = sugestao.frete_valor || '';

        // Guardar confianca
        document.getElementById('confianca-valor').value = sugestao.confianca || '';

        // Mostrar indicador de confianca
        var confEl = document.getElementById('indicador-confianca');
        var confianca = sugestao.confianca;
        if (typeof confianca === 'number') {
          confEl.style.display = 'inline';
          if (confianca >= 80) {
            confEl.textContent = 'Confian\u00E7a: ' + confianca + '%';
            confEl.style.color = '#22c55e';
          } else if (confianca >= 50) {
            confEl.textContent = 'Confian\u00E7a: ' + confianca + '% \u2014 revise';
            confEl.style.color = '#eab308';
          } else {
            confEl.textContent = 'Confian\u00E7a BAIXA: ' + confianca + '% \u2014 revise com cuidado';
            confEl.style.color = 'var(--accent)';
          }
        }

        // Limpar e preencher itens
        var lista = document.getElementById('itens-lista');
        lista.innerHTML = '';
        if (sugestao.itens && sugestao.itens.length > 0) {
          for (var i = 0; i < sugestao.itens.length; i++) {
            adicionarItem(sugestao.itens[i].nome, sugestao.itens[i].quantidade, sugestao.itens[i].preco_unitario);
          }
        } else {
          adicionarItem();
        }

        recalcularPrevia();

        statusEl.textContent = 'Pedido extra\u00EDdo! Revise e salve.';
        statusEl.style.color = '#22c55e';
      } catch (erro) {
        erroEl.style.display = 'block';
        erroEl.textContent = erro.message || 'Erro ao extrair. Digite os dados manualmente.';
        statusEl.style.display = 'none';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Extrair Pedido';
      }
    }
  </script>
</body>
</html>
