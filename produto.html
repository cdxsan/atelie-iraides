<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vestido — Ateliê Iraides</title>
  <link rel="stylesheet" href="css/estilo.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="top-bar">
    <div class="top-bar-inner">
      <a href="index.html" class="top-bar-logo">
        <svg class="logo-icon" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 4C10 4 8 7 8 9l-3 6 2 2 4-2-1 9h8l-1-9 4 2 2-2-3-6c0-2-2-5-6-5z" stroke="#ff6b6b" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        </svg>
        Ateliê <span>Iraides</span>
      </a>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu">☰</button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="catalogo.html">Catálogo</a>
        <span class="nav-divider"></span>
        <span class="nav-label">Protegido</span>
        <a href="pedidos.html">Pedidos</a>
        <a href="carrinho.html" class="nav-carrinho">Carrinho</a>
        <span class="nav-divider"></span>
        <a href="login.html" class="entrar" id="nav-entrar">Entrar</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <div id="produto-conteudo">
      <!-- preenchido por js -->
    </div>
  </main>

  <div id="aviso-futuro" class="aviso-futuro"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>ajustarNav();</script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var produto = vestidos.find(function(v) { return v.id === id; });

      if (!produto) {
        document.getElementById('produto-conteudo').innerHTML =
          '<p style="color:#808080;">Vestido não encontrado.</p>' +
          '<a href="catalogo.html" class="btn btn-outline">Ver Catálogo</a>';
        return;
      }

      var html = '';

      // Foto
      html += '<div class="produto-detalhe-img" style="background:' + produto.cor + '">';
      html += '<img src="' + gerarImagemVestido(produto.nome, produto.cor) + '" style="width:100%;height:100%;object-fit:cover;display:block;" alt="' + produto.nome + '">';
      html += '</div>';

      // Info
      html += '<div class="produto-info">';
      html += '<h1>' + produto.nome + '</h1>';

      if (produto.disponivel) {
        html += '<div class="preco-grande">' + formatarCentavos(produto.preco) + '</div>';
      } else {
        html += '<div style="color:#666;font-size:15px;margin-bottom:12px;">Indisponível no momento</div>';
      }

      html += '<p class="descricao">' + produto.descricao + '</p>';
      html += '</div>';

      // Frete fixo
      html += '<div class="frete-box" style="border-color:rgba(76,175,80,0.3);">';
      html += '<div style="display:flex;align-items:center;gap:10px;">';
      html += '<span style="font-size:22px;">🚚</span>';
      html += '<div><div style="font-size:15px;font-weight:600;color:#fff;">Taxa de entrega</div>';
      html += '<div style="font-size:13px;color:var(--text3);">Aparecida de Goiânia — GO</div></div>';
      html += '<div style="margin-left:auto;font-size:18px;font-weight:700;color:var(--green);">R$ 12,00</div>';
      html += '</div>';
      html += '</div>';

      // Instagram embed placeholder (prova social)
      html += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;">';
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">';
      html += '<div style="width:36px;height:36px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:16px;">📸</div>';
      html += '<div><div style="font-size:14px;font-weight:600;color:#fff;">@iraides.atelie</div><div style="font-size:12px;color:var(--text3);">Ver no Instagram</div></div>';
      html += '</div>';
      html += '<div style="background:var(--surface2);border-radius:var(--radius);padding:24px;text-align:center;color:var(--text3);font-size:14px;">';
      html += '📷 Post do Instagram incorporado aqui';
      html += '</div>';
      html += '</div>';

      // Tamanho
      if (produto.disponivel) {
        html += '<div class="card">';
        html += '<label class="form-label">Tamanho</label>';
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;">';
        ;['P', 'M', 'G', 'GG'].forEach(function(t) {
          html += '<label style="flex:1;min-width:48px;text-align:center;padding:10px;background:var(--surface2);border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:15px;">';
          html += '<input type="radio" name="tamanho" value="' + t + '" style="display:none;" onchange="marcarTamanho(this)">';
          html += '<span>' + t + '</span>';
          html += '</label>';
        });
        html += '</div>';
        html += '<input type="hidden" id="tamanho-selecionado" value="">';
        html += '</div>';

        html += '<div class="card">';
        html += '<label class="form-label">Quantidade</label>';
        html += '<input class="form-input" id="qtd-carrinho" type="number" value="1" min="1" style="min-height:40px;padding:10px;">';
        html += '</div>';

        html += '<button class="btn btn-primary" onclick="adicionarAoCarrinho(\'' + produto.id + '\')" id="btn-carrinho">Adicionar ao Carrinho</button>';
      }

      // Link de volta
      html += '<a href="catalogo.html" class="btn btn-outline" style="margin-top:8px;">Ver outros modelos</a>';

      document.getElementById('produto-conteudo').innerHTML = html;
    })();

    function marcarTamanho(el) {
      document.getElementById('tamanho-selecionado').value = el.value;
      document.querySelectorAll('input[name="tamanho"]').forEach(function(r) {
        r.closest('label').style.borderColor = r.checked ? 'var(--accent)' : 'var(--border)';
      });
    }

    async function adicionarAoCarrinho(id) {
      var logado = await estaLogado();
      if (!logado) {
        window.location.href = 'login.html?redirect=' + window.location.pathname + window.location.search;
        return;
      }

      var produto = vestidos.find(function(v) { return v.id === id; });
      if (!produto) return;

      var tamanho = document.getElementById('tamanho-selecionado').value;
      if (!tamanho) {
        mostrarAvisoMsg('Escolha um tamanho.');
        return;
      }

      var qtdTexto = document.getElementById('qtd-carrinho').value;
      var erroQtd = validarInteiroPositivo(qtdTexto, 'Quantidade');
      if (erroQtd) {
        mostrarAvisoMsg(erroQtd);
        return;
      }

      var qtd = parseInt(qtdTexto);
      carrinhoAdd(produto, tamanho, qtd);

      var btn = document.getElementById('btn-carrinho');
      btn.textContent = '✓ Adicionado ao Carrinho (' + carrinhoContar() + ' itens)';
      btn.style.background = 'var(--green)';
      setTimeout(function() {
        btn.textContent = 'Adicionar ao Carrinho';
        btn.style.background = '';
      }, 2000);
    }

    function mostrarAvisoMsg(msg) {
      var el = document.getElementById('aviso-futuro');
      if (el) {
        el.textContent = msg;
        el.classList.add('visivel');
        setTimeout(function() { el.classList.remove('visivel'); }, 3000);
      }
    }
  </script>
</body>
</html>
